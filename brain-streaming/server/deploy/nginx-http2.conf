# HTTP/2 reverse proxy for the DGX brain-streaming server (uvicorn on :8010).
#
# Browsers negotiate HTTP/2 only over TLS. Generate a self-signed cert once:
#   mkdir -p /etc/nginx/certs && cd /etc/nginx/certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#     -keyout dgx.key -out dgx.crt -subj "/CN=$(hostname)"
#
# Why: lifts the HTTP/1.1 6-connections-per-origin cap — the client's parallel
# brick GETs become multiplexed streams on one connection, so volume.html's
# MAX_CONCURRENCY can be raised well above 6.
#
# Include this under http{} (or copy into sites-enabled) and reload nginx.
# Then open  https://<dgx-host>:8443/

server {
    listen 8443 ssl;
    http2 on;                      # nginx >= 1.25.1; older: `listen 8443 ssl http2;`
    server_name _;

    ssl_certificate     /etc/nginx/certs/dgx.crt;
    ssl_certificate_key /etc/nginx/certs/dgx.key;

    client_max_body_size 64m;
    gzip off;                      # bricks are uint8 binary — gzip just burns CPU

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;       # stream binary brick payloads straight through
        proxy_read_timeout 300s;   # long first-L0 ROI fetches
    }
}
