# Multi-block brain streaming server.
#
#   docker compose up --build            # CPU (default)
#   docker compose --profile gpu up --build brain-gpu   # A100 / CuPy
#
# Override the port / streamed levels / voxel size / blocks via the env vars
# below or by editing `command`.
services:
  brain:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: brain-streaming
    ports:
      - "${PORT:-8010}:8010"
    command: ["--no-gpu", "--min-level", "${MIN_LEVEL:-4}"]
    # brain 2 (local hb02 fused RGB volume): bind-mount it at the same path the
    # server looks for by default so it appears in the brain selector. Override the
    # host path with HB02_DIR; harmless if the directory does not exist.
    volumes:
      - "${HB02_DIR:-/home/users/azhar/projectM/viewer_data/fused_8um}:/home/users/azhar/projectM/viewer_data/fused_8um:ro"
    restart: unless-stopped

  # A100 / CuPy variant. Needs the NVIDIA Container Toolkit on the host.
  # Enable with:  docker compose --profile gpu up --build brain-gpu
  brain-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: server/Dockerfile.gpu
    image: brain-streaming:gpu
    ports:
      - "${PORT:-8010}:8010"
    command: ["--min-level", "${MIN_LEVEL:-4}"]
    volumes:
      - "${HB02_DIR:-/home/users/azhar/projectM/viewer_data/fused_8um}:/home/users/azhar/projectM/viewer_data/fused_8um:ro"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
